# CI: checks that every push to main and every pull request
#   - installs dependencies from package-lock.json
#     (npm ci --legacy-peer-deps, as the Dockerfile does),
#   - typechecks the TypeScript config and src (tsc --noEmit),
#   - produces a production build of Strapi and its admin panel
#     (npm run build = strapi build),
#   - on pull requests only, builds the Docker image without pushing it
#     (pushes to main already build it in docker-publish.yml).
# The repo has no lint script or unit tests; scripts/smoke-test.sh needs a
# running Strapi with a database, so it is not run here. No deploy happens here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        id: install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_ENV: production
        run: npm run build

  docker:
    name: Docker build (no push)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
